services:
  - type: web
    name: waveform
    runtime: docker
    plan: starter
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /api/ready
    disk:
      name: waveform-workspace
      mountPath: /app/data/workspace
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: AUTH_SECURE_COOKIE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/data/workspace/waveform.db
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
